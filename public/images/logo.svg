<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345 96" width="345" height="96" role="img" aria-label="BuildIT" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>BuildIT</title>
  <defs>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMagenta" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon: hexagon + CPU chip -->
  <g fill="none" stroke-linejoin="miter">
    <polygon points="48,8 83,28 83,68 48,88 13,68 13,28" stroke="#00f0ff" stroke-width="3" filter="url(#glowCyan)"/>
    <rect x="34" y="34" width="28" height="28" stroke="#ff0055" stroke-width="3" filter="url(#glowMagenta)"/>
    <g stroke="#ff0055" stroke-width="3" stroke-linecap="butt">
      <path d="M28 42H34M28 54H34M62 42H68M62 54H68M42 28V34M54 28V34M42 62V68M54 62V68"/>
    </g>
    <rect x="44" y="44" width="8" height="8" fill="#00f0ff" stroke="none"/>
  </g>

  <!-- Wordmark drawn as paths, so it needs no font -->
  <g fill="none" stroke-width="6" stroke-linejoin="miter" stroke-linecap="butt">
    <g stroke="#f8fafc">
      <path transform="translate(108 26)" d="M3 3H18L24 9V16L18 22H3M3 3V41M18 22L24 28V35L18 41H3"/> <!-- B -->
      <path transform="translate(145 26)" d="M3 3V33L11 41H19L27 33V3"/>                              <!-- U -->
      <path transform="translate(185 26)" d="M3 3V41"/>                                               <!-- I -->
      <path transform="translate(201 26)" d="M3 3V41H23"/>                                            <!-- L -->
      <path transform="translate(237 26)" d="M3 3H17L27 13V31L17 41H3Z"/>                             <!-- D -->
    </g>
    <g stroke="#ff0055" filter="url(#glowMagenta)">
      <path transform="translate(287 26)" d="M3 3V41"/>                                               <!-- I -->
      <path transform="translate(303 26)" d="M2 3H28M15 3V41"/>                                       <!-- T -->
    </g>
  </g>
</svg>
